[Basic]
OpenDebug = true

[mysql]
# MySQL address, e.g. 127.0.0.1:3306
Addr = mysql.ai-gateway-system:3306

# dedicated minimal-privilege account (INSERT/UPDATE on target table only)
User = root
Password = root123

# target database and table (table created by conf/db/report_db_ddl_mysql.sql)
DBName = bfe_report
Table = bfe_ai_request_log

# single connect/ping timeout in milliseconds
# (bounds one attempt; guards against OS-level TCP timeouts on blackholed IPs)
ConnectTimeoutMs = 3000

# interval between connect retries in milliseconds
# (when mysql is unreachable at startup or lost at runtime, log-reader stays up
#  and retries in background)
ConnectRetryIntervalMs = 3000

# UP-period health ping interval in milliseconds (default 0 = disabled)
# (when > 0, a failed ping marks the connection down and triggers reconnect;
#  enables earlier detection of half-open connections)
HealthPingIntervalMs = 0

[Writer]
# record buffer queue size (records)
QueueSize = 2000

# batch size (records)
BatchSize = 200

# batch flush interval in milliseconds
FlushIntervalMs = 2000

# max retries on write failure (backoff 200ms/400ms/800ms)
MaxRetries = 3

# single batch transaction timeout in milliseconds (ExecContext deadline and
# driver writeTimeout; guards the write path against hangs on network partition)
BatchTimeoutMs = 30000

# connection pool
MaxOpenConns = 10
MaxIdleConns = 5
