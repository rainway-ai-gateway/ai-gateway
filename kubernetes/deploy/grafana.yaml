# Grafana Deployment + Service — optional observability, applies to default namespace.
# ConfigMap is generated separately: scripts/sync-grafana.sh → grafana-configmap.yaml
# Usage:
#   kubectl apply -f deploy/grafana-configmap.yaml
#   kubectl apply -f deploy/grafana.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: default
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: ghcr.io/cc14514/grafana:11.5.1
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_INSTALL_PLUGINS
          value: ""
        volumeMounts:
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboard-providers
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboards
          mountPath: /etc/grafana/dashboards
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: grafana-datasources
        configMap:
          name: grafana-config
          items:
          - key: datasource.yaml
            path: doris.yaml
      - name: grafana-dashboard-providers
        configMap:
          name: grafana-config
          items:
          - key: dashboard-provider.yaml
            path: bfe_ai.yaml
      - name: grafana-dashboards
        configMap:
          name: grafana-config
          items:
          - key: dashboard.json
            path: bfe-ai-gateway-observability.json

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: default
spec:
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 30300
  type: NodePort
