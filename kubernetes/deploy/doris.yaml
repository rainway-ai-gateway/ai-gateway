# Doris (FE + BE + init Job) — optional observability, applies to default namespace.
# ConfigMap is generated separately: scripts/sync-doris.sh → doris-configmap.yaml
# Usage:
#   kubectl apply -f deploy/doris-configmap.yaml
#   kubectl apply -f deploy/doris.yaml
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: doris-fe
  namespace: default
  labels:
    app: doris-fe
spec:
  serviceName: doris-fe
  replicas: 1
  selector:
    matchLabels:
      app: doris-fe
  template:
    metadata:
      labels:
        app: doris-fe
    spec:
      containers:
      - name: doris-fe
        image: ghcr.io/cc14514/doris-fe:4.1.3
        command: ["bash", "/opt/apache-doris/fe_entrypoint.sh", "doris-fe-0.doris-fe.default.svc.cluster.local"]
        ports:
        - name: http
          containerPort: 8030
        - name: mysql
          containerPort: 9030
        volumeMounts:
        - name: doris-fe-meta
          mountPath: /opt/apache-doris/fe/doris-meta
      volumes:
      - name: doris-fe-meta
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: doris-fe
  namespace: default
spec:
  clusterIP: None
  selector:
    app: doris-fe
  ports:
  - name: http
    port: 8030
    targetPort: 8030
  - name: mysql
    port: 9030
    targetPort: 9030

---
apiVersion: v1
kind: Service
metadata:
  name: doris-fe-web
  namespace: default
spec:
  selector:
    app: doris-fe
  ports:
  - name: http
    port: 8030
    targetPort: 8030
    nodePort: 30803
  type: NodePort

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: doris-be
  namespace: default
  labels:
    app: doris-be
spec:
  serviceName: doris-be
  replicas: 1
  selector:
    matchLabels:
      app: doris-be
  template:
    metadata:
      labels:
        app: doris-be
    spec:
      initContainers:
      - name: wait-fe
        image: ghcr.io/cc14514/mysql:8
        command:
          - sh
          - -c
          - |
            echo "Waiting for Doris FE..."
            until mysqladmin ping -h doris-fe.default.svc.cluster.local -P 9030 -uroot --silent; do
              echo "  FE not ready, retrying in 5s..."
              sleep 5
            done
            echo "Doris FE ready"
      containers:
      - name: doris-be
        image: ghcr.io/cc14514/doris-be:4.1.3
        command: ["bash", "/opt/apache-doris/be_entrypoint.sh", "doris-fe-0.doris-fe.default.svc.cluster.local"]
        ports:
        - name: http
          containerPort: 8040
        - name: heartbeat
          containerPort: 9050
        env:
        - name: FE_SERVERS
          value: "fe:1:doris-fe.default.svc.cluster.local:9010"
        volumeMounts:
        - name: doris-be-storage
          mountPath: /opt/apache-doris/be/storage
      volumes:
      - name: doris-be-storage
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: doris-be
  namespace: default
spec:
  clusterIP: None
  selector:
    app: doris-be
  ports:
  - name: http
    port: 8040
    targetPort: 8040
  - name: heartbeat
    port: 9050
    targetPort: 9050

---
apiVersion: batch/v1
kind: Job
metadata:
  name: observability-init
  namespace: default
  labels:
    app: observability-init
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-fe
        image: ghcr.io/cc14514/mysql:8
        command:
          - sh
          - -c
          - |
            echo "Waiting for Doris FE..."
            until mysqladmin ping -h doris-fe.default.svc.cluster.local -P 9030 -uroot --silent; do
              sleep 5
            done
            echo "FE ready"
      containers:
      - name: init
        image: ghcr.io/cc14514/mysql:8
        command:
          - sh
          - -c
          - |
            set -eu
            echo "Checking if Doris is already initialized..."
            DB_COUNT=$(mysql -h doris-fe.default.svc.cluster.local -P 9030 -uroot -sN \
                -e "SELECT COUNT(*) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='bfe_observability';" 2>/dev/null || echo "0")
            if [ "$DB_COUNT" -gt 0 ]; then
                echo "Database already initialized, skipping."
                exit 0
            fi
            echo "Starting Doris initialization..."
            is_first=true
            for f in /sql/*.sql; do
              echo "  Executing $f..."
              if [ "$is_first" = true ]; then
                mysql -h doris-fe-0.doris-fe.default.svc.cluster.local -P 9030 -uroot < "$f" || exit 1
                is_first=false
              else
                mysql -h doris-fe-0.doris-fe.default.svc.cluster.local -P 9030 -uroot bfe_observability < "$f" || exit 1
              fi
            done
            echo "Doris initialization complete."
        volumeMounts:
        - name: init-sql
          mountPath: /sql
      volumes:
      - name: init-sql
        configMap:
          name: doris-init-sql
