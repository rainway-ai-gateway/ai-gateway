apiVersion: apps/v1
kind: Deployment
metadata:
  name: bfe
  namespace: ai-gateway-system
  labels:
    app: bfe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bfe
  template:
    metadata:
      labels:
        app: bfe
    spec:
      initContainers:
        # Wait for the report database schema before bfe starts. log-reader's
        # mod_log_mysql is fail-fast on db.Ping(): at Pod start the mysql
        # Service endpoints/DNS may not exist yet, which kills log-reader
        # (and silently stops all pb access log export). Waiting for BOTH
        # report tables also implies the mysql-init Job has finished.
        - name: wait-for-report-db
          imagePullPolicy: IfNotPresent
          image: ghcr.io/cc14514/mysql:8
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
          command:
            - sh
            - -c
            - |
              set -eu
              host="mysql.ai-gateway-system.svc.cluster.local"
              echo "Waiting for MySQL to be ready..."
              until mysqladmin ping -h "$host" -uroot --password="$MYSQL_ROOT_PASSWORD" --silent; do
                echo "MySQL is not ready yet, sleeping 5s..."
                sleep 5
              done
              echo "Waiting for report tables (bfe_report) to be created..."
              deadline=$(( $(date +%s) + 300 ))
              while true; do
                table_count=$(mysql --protocol=tcp -h "$host" -uroot --password="$MYSQL_ROOT_PASSWORD" -N -s \
                  -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='bfe_report' AND table_name IN ('bfe_ai_request_log','bfe_ai_metrics_1m');" 2>/dev/null || true)
                [ "$table_count" = "2" ] && break
                if [ "$(date +%s)" -gt "$deadline" ]; then
                  echo "ERROR: report tables not ready within 300s (found: ${table_count:-none} of 2)" >&2
                  exit 1
                fi
                echo "Report tables not ready yet (found: ${table_count:-none} of 2), sleeping 5s..."
                sleep 5
              done
              echo "Report database is ready!"
      containers:
      - name: bfe
        image: ghcr.io/bfenetworks/bfe:v1.8.1-debug # 替换为实际镜像
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Asia/Shanghai
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: https
          containerPort: 8443
          protocol: TCP
        - name: monitor
          containerPort: 8421
          protocol: TCP
        - name: lr-monitor
          containerPort: 8992
          protocol: TCP
        volumeMounts:
        - name: bfe-conf
          mountPath: /home/work/bfe/conf/bfe.conf
          subPath: bfe.conf
          readOnly: false
        - name: bfe-conf
          mountPath: /home/work/bfe/conf/name_conf.data
          subPath: name_conf.data
          readOnly: false
        - name: conf-agent-conf
          mountPath: /home/work/conf-agent/conf/conf-agent.toml
          subPath: conf-agent.toml
          readOnly: false
        - name: log-reader-conf
          mountPath: /home/work/log-reader/conf/config.conf
          subPath: config.conf
          readOnly: false
        - name: log-reader-conf
          mountPath: /home/work/log-reader/conf/mod_kafka/mod_kafka.conf
          subPath: mod_kafka.conf
          readOnly: false
        - name: log-reader-conf
          mountPath: /home/work/log-reader/conf/mod_kafka/kafka_config.data
          subPath: kafka_config.data
          readOnly: false
        - name: log-reader-conf
          mountPath: /home/work/log-reader/conf/mod_log_mysql/mod_log_mysql.conf
          subPath: mod_log_mysql.conf
          readOnly: false
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /monitor
            port: 8421
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /monitor
            port: 8421
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: bfe-conf
        configMap:
          name: bfe-config
      - name: conf-agent-conf
        configMap:
          name: conf-agent-config
      - name: log-reader-conf
        configMap:
          name: log-reader-config

---
apiVersion: v1
kind: Service
metadata:
  name: bfe
  namespace: ai-gateway-system
  labels:
    app: bfe
spec:
  selector:
    app: bfe
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
    nodePort: 30080
  - name: https
    port: 8443
    targetPort: 8443
    protocol: TCP
    nodePort: 30443
  - name: monitor
    port: 8421
    targetPort: 8421
    protocol: TCP
    nodePort: 30421
  type: NodePort
