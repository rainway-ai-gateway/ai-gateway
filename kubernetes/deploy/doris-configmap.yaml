  02_create_detail_table.sql: |
    USE bfe_observability;
    
    CREATE TABLE bfe_ai_request_log (
        hostid                  VARCHAR(256)    COMMENT '主机标识，格式 hostname_netns',
        log_time                DATETIME        COMMENT '日志产生时间',
        ai_apikey_id            VARCHAR(256)    COMMENT 'API Key ID',
        ai_requested_model      VARCHAR(128)    COMMENT '请求模型名',
    
        -- logid：逐请求唯一标识（bfe#1417 起由 BFE 保证非 0）；作为 UNIQUE KEY 成员必须 NOT NULL
        -- （Doris KEY 列不允许 NULL；Routine Load 映射始终提供该列）
        logid                   BIGINT NOT NULL COMMENT 'BFE 请求唯一标识（逐请求唯一、非 0；bfe#1417）',
        product                 VARCHAR(64)     COMMENT '产品标识',
        log_tag                 VARCHAR(64)     COMMENT '日志标签：req_<product> / req_err_<product>',
    
        -- 客户端连接
        client_ip               VARCHAR(64)     COMMENT '客户端 IP',
        client_network          VARCHAR(16)     COMMENT '客户端网络类型：Ipv4/Ipv6',
        is_trust_src_ip         TINYINT         COMMENT '是否可信源 IP',
        req_num                 INT             COMMENT '会话内请求序号（从 1 开始）',
        session_id              BIGINT          COMMENT '会话 ID',
        bfe_ip                  VARCHAR(64)     COMMENT 'BFE 服务器 IP',
        sock_src_ip             VARCHAR(64)     COMMENT 'Socket 源 IP',
        vip                     VARCHAR(64)     COMMENT '目的 VIP',
        vip6                    VARCHAR(128)    COMMENT '目的 VIP6',
    
        -- 错误信息
        err_code                VARCHAR(64)     COMMENT '错误码',
        err_msg                 VARCHAR(512)    COMMENT '错误详情',
    
        -- 请求头
        proto                   VARCHAR(16)     COMMENT 'HTTP 协议版本',
        header_host             VARCHAR(256)    COMMENT '请求 Host',
        origin_uri              VARCHAR(2048)   COMMENT '原始请求 URI',
        final_uri               VARCHAR(2048)   COMMENT '最终路由 URI',
        method                  VARCHAR(16)     COMMENT 'HTTP 方法',
        content_type            VARCHAR(128)    COMMENT '请求 Content-Type',
        x_forward_for           VARCHAR(1024)   COMMENT 'X-Forwarded-For',
        accept_language         VARCHAR(256)    COMMENT 'Accept-Language',
        authorization           VARCHAR(1024)   COMMENT 'Authorization 头',
        transfer_encoding       VARCHAR(64)     COMMENT 'Transfer-Encoding',
        referrer                VARCHAR(2048)   COMMENT 'Referer 头',
        user_agent              VARCHAR(1024)   COMMENT 'User-Agent 头',
        delegation              VARCHAR(256)    COMMENT '委托域名',
        uid                     VARCHAR(256)    COMMENT 'UID 头',
        cookie                  VARCHAR(4096)   COMMENT 'Cookie 头',
        req_headers             ARRAY<STRUCT<
            `key`   : VARCHAR(128),
            value   : VARCHAR(2048)
        >>                                      COMMENT '请求头列表',
        req_header_len          INT             COMMENT '请求头长度（字节）',
        req_body_len            INT             COMMENT '请求体长度（字节）',
    
        -- 路由
        cluster                 VARCHAR(256)    COMMENT '目标集群',
        sub_cluster             VARCHAR(256)    COMMENT '目标子集群',
        backend_info            VARCHAR(256)    COMMENT '后端 IP:Port',
        backend_retry           TINYINT         COMMENT '后端重试次数',
    
        -- 响应
        res_status_code         SMALLINT        COMMENT '响应状态码',
        res_header_len          INT             COMMENT '响应头长度（字节）',
        res_body_len            INT             COMMENT '响应体长度（字节）',
        res_content_type        VARCHAR(128)    COMMENT '响应 Content-Type',
        res_location            VARCHAR(2048)   COMMENT '响应 Location（3xx）',
        res_transfer_encoding   VARCHAR(64)     COMMENT '响应 Transfer-Encoding',
        res_headers             ARRAY<STRUCT<
            `key`   : VARCHAR(128),
            value   : VARCHAR(2048)
        >>                                      COMMENT '响应头列表',
    
        -- 耗时（毫秒）
        all_time                INT             COMMENT '请求总耗时',
        read_client_time        INT             COMMENT '读客户端耗时',
        cluster_serve_time      INT             COMMENT '集群层耗时',
        backend_serve_time      INT             COMMENT '后端耗时',
        write_client_time       INT             COMMENT '写客户端耗时',
        connect_backend_time    INT             COMMENT '连接后端耗时',
        proxy_delay_time        INT             COMMENT '代理延迟',
        session_offset_time     INT             COMMENT '会话内时间偏移（毫秒）',
    
        -- AI 可观测 — API Key 标签（按层级打平，v1.1）
        level1Name              VARCHAR(128)    COMMENT 'Level1 标签名',
        level1                  VARCHAR(128)    COMMENT 'Level1 标签值',
        level2Name              VARCHAR(128)    COMMENT 'Level2 标签名',
        level2                  VARCHAR(128)    COMMENT 'Level2 标签值',
        level3Name              VARCHAR(128)    COMMENT 'Level3 标签名',
        level3                  VARCHAR(128)    COMMENT 'Level3 标签值',
        level4Name              VARCHAR(128)    COMMENT 'Level4 标签名',
        level4                  VARCHAR(128)    COMMENT 'Level4 标签值',
        level5Name              VARCHAR(128)    COMMENT 'Level5 标签名',
        level5                  VARCHAR(128)    COMMENT 'Level5 标签值',
    
        -- AI 可观测 (v0.2.0)
        ai_target_model         VARCHAR(128)    COMMENT '实际路由模型名',
        ai_stream               TINYINT         COMMENT '是否流式：0=非流式, 1=流式',
        ai_input_tokens         BIGINT          COMMENT '输入 Token 数',
        ai_output_tokens        BIGINT          COMMENT '输出 Token 数',
        ai_total_tokens         BIGINT          COMMENT '总 Token 数',
        ai_cache_read_tokens    BIGINT          COMMENT '缓存读取 Token 数',
        ai_cache_write_tokens   BIGINT          COMMENT '缓存写入 Token 数',
        ai_audio_input_tokens   BIGINT          COMMENT '音频输入 Token 数',
        ai_audio_output_tokens  BIGINT          COMMENT '音频输出 Token 数',
        ai_image_count          BIGINT          COMMENT '图片数量',
        ai_ttft_us              BIGINT          COMMENT '首 Token 延迟 TTFT（微秒）',
        ai_tpot_us              BIGINT          COMMENT '每 Token 延迟 TPOT（微秒）',
        ai_provider             VARCHAR(64)     COMMENT '上游模型提供商',
        ai_protocol             VARCHAR(64)     COMMENT 'AI 协议',
        ai_mode                 VARCHAR(64)     COMMENT 'AI 模式',
        ai_retry_count          INT             COMMENT '模型调用层重试次数',
        ai_cost_value           BIGINT          COMMENT '成本固定点整数值',
        ai_cost_currency        VARCHAR(16)     COMMENT '成本币种',
        ai_route_rule_hits      ARRAY<STRUCT<
            rule_owner       : VARCHAR(128),
            rule_owner_type  : VARCHAR(64),
            rule_name        : VARCHAR(128)
        >>                                      COMMENT 'AI 路由规则命中记录',
        ai_cluster_key_names    ARRAY<STRUCT<
            cluster_name : VARCHAR(128),
            key_name     : VARCHAR(128)
        >>                                      COMMENT '尝试过的集群与 Key 名称组合',
        ai_rate_limit_hits      ARRAY<STRUCT<
            rate_limit_policy_id : VARCHAR(128),
            rate_limit_type      : VARCHAR(32),
            rule_names           : ARRAY<VARCHAR(128)>
        >>                                      COMMENT '限流命中列表',
        -- 限流首个命中打平列（Doris 3.0 不支持 ARRAY<STRUCT> 元素字段解引用，由 Routine Load 在导入时打平）
        rate_limit_policy_id    VARCHAR(128)    COMMENT '限流策略 ID（取首个命中，打平列）',
        rate_limit_type         VARCHAR(32)     COMMENT '限流类型（取首个命中，打平列）',
        rate_limit_rule_name    VARCHAR(128)    COMMENT '限流规则名（取首条规则，打平列）',
        ai_auth_reject_reason   VARCHAR(256)    COMMENT '认证拒绝原因',
        ai_auth_reject_quota_plans ARRAY<VARCHAR(128)> COMMENT '被拒绝的配额计划',
        ai_auth_hit_quota_plans ARRAY<VARCHAR(128)> COMMENT '成功请求时命中的配额计划',
    
        -- AI 可观测 — 缓存/镜像/意图（v0.8 报表二期）
        ai_cache_status         VARCHAR(16)     COMMENT '缓存状态：hit/miss/skip，空=未启用',
        mirror_hit              BOOLEAN         COMMENT '镜像是否命中',
        mirror_cluster          VARCHAR(128)    COMMENT '镜像集群',
        ai_intent_question      VARCHAR(64)     COMMENT '意图问题',
        ai_intent_answer        VARCHAR(64)     COMMENT '意图答案（含 unknown）',
        ai_intent_confidence    DOUBLE          COMMENT '意图置信度（NULL=未分类）',
        ai_intent_source        VARCHAR(32)     COMMENT '意图来源：explicit_header/classifier/cache',
        ai_intent_latency_us    BIGINT          COMMENT '意图决策耗时（微秒，NULL=未分类）',
        ai_intent_cache_hit     BOOLEAN         COMMENT '意图缓存命中（NULL=未分类）',
        ai_intent_questions_version VARCHAR(32) COMMENT '意图问题集版本'
    )
    -- 唯一键含请求级判别列 logid（bfe#1417）：log_time 为秒级，缺 logid 时同秒同 Key 同模型的并发
    -- 请求会互相合并、只留 1 行（丢率 (n-1)/n，生产窗口实测 13.5%）；logid 恰为第 5 列，键仍是
    -- 列前缀（Doris 对 KEY 列的硬约束）。存量升级脚本：sqls/upgrade/2026-10-13-issue-1417-detail-unique-key-logid/
    UNIQUE KEY(hostid, log_time, ai_apikey_id, ai_requested_model, logid)
    PARTITION BY RANGE(log_time) (
        PARTITION p_init VALUES LESS THAN ('2026-10-19')
    )
    DISTRIBUTED BY HASH(ai_apikey_id) BUCKETS 32
    PROPERTIES (
        "replication_num" = "1",
        "dynamic_partition.enable" = "true",
        "dynamic_partition.time_unit" = "DAY",
        "dynamic_partition.start" = "-7",
        "dynamic_partition.end" = "3",
        "dynamic_partition.prefix" = "p",
        "dynamic_partition.buckets" = "32",
        "compression" = "zstd"
    );
  03_create_routine_load.sql: |
    USE bfe_observability;
    
    CREATE ROUTINE LOAD bfe_ai_log_load ON bfe_ai_request_log
    COLUMNS(
        logid,
        timestamp,
        -- 存储 UTC 墙钟（与 MySQL 链路 log-reader 写入口径一致）：FROM_UNIXTIME 按会话时区
        -- 解释 epoch，此处减去会话相对 UTC 的偏移，保证任何 FE 时区下结果一致。
        log_time         = DATE_SUB(FROM_UNIXTIME(timestamp), INTERVAL TIMESTAMPDIFF(SECOND, UTC_TIMESTAMP(), NOW()) SECOND),
        product,
        log_tag,
        hostid,
        client_ip,
        client_network,
        is_trust_src_ip,
        req_num,
        session_id,
        bfe_ip,
        sock_src_ip,
        vip,
        vip6,
        err_code,
        err_msg,
        req_header_len,
        req_body_len,
        proto,
        header_host,
        origin_uri,
        final_uri,
        method,
        content_type,
        x_forward_for,
        accept_language,
        authorization,
        transfer_encoding,
        referrer,
        user_agent,
        delegation,
        uid,
        cookie,
        req_headers,
        cluster,
        sub_cluster,
        backend_info,
        backend_retry,
        res_status_code,
        res_header_len,
        res_body_len,
        res_content_type,
        res_location,
        res_transfer_encoding,
        res_headers,
        all_time,
        read_client_time,
        cluster_serve_time,
        backend_serve_time,
        write_client_time,
        connect_backend_time,
        proxy_delay_time,
        session_offset_time,
        ai_apikey_id,
        ai_apikeytags,
        level1Name       = json_unquote(json_extract(ai_apikeytags, '$.level1.tagname')),
        level1           = json_unquote(json_extract(ai_apikeytags, '$.level1.tagvalue')),
        level2Name       = json_unquote(json_extract(ai_apikeytags, '$.level2.tagname')),
        level2           = json_unquote(json_extract(ai_apikeytags, '$.level2.tagvalue')),
        level3Name       = json_unquote(json_extract(ai_apikeytags, '$.level3.tagname')),
        level3           = json_unquote(json_extract(ai_apikeytags, '$.level3.tagvalue')),
        level4Name       = json_unquote(json_extract(ai_apikeytags, '$.level4.tagname')),
        level4           = json_unquote(json_extract(ai_apikeytags, '$.level4.tagvalue')),
        level5Name       = json_unquote(json_extract(ai_apikeytags, '$.level5.tagname')),
        level5           = json_unquote(json_extract(ai_apikeytags, '$.level5.tagvalue')),
        ai_requested_model,
        ai_target_model,
        ai_stream,
        ai_input_tokens,
        ai_output_tokens,
        ai_total_tokens,
        ai_cache_read_tokens,
        ai_cache_write_tokens,
        ai_audio_input_tokens,
        ai_audio_output_tokens,
        ai_image_count,
        ai_ttft_us,
        ai_tpot_us,
        ai_provider,
        ai_protocol,
        ai_mode,
        ai_retry_count,
        ai_cost_value,
        ai_cost_currency,
        ai_route_rule_hits,
        ai_cluster_key_names,
        ai_rate_limit_hits,
        rate_limit_policy_id = json_unquote(json_extract(ai_rate_limit_hits, '$[0].rate_limit_policy_id')),
        rate_limit_type      = json_unquote(json_extract(ai_rate_limit_hits, '$[0].rate_limit_type')),
        rate_limit_rule_name = json_unquote(json_extract(ai_rate_limit_hits, '$[0].rule_names[0]')),
        ai_auth_reject_reason,
        ai_auth_reject_quota_plans,
        ai_auth_hit_quota_plans,
        ai_cache_status,
        mirror_hit,
        mirror_cluster,
        ai_intent_question,
        ai_intent_answer,
        ai_intent_confidence,
        ai_intent_source,
        ai_intent_latency_us,
        ai_intent_cache_hit,
        ai_intent_questions_version
    )
    PROPERTIES (
        "desired_concurrent_number" = "3",
        "max_batch_interval" = "20",
        "max_batch_rows" = "250000",
        "max_error_number" = "1000",
        "format" = "json"
    )
    FROM KAFKA (
        "kafka_broker_list" = "kafka.ai-gateway-system.svc.cluster.local:9092",
        "kafka_topic" = "bfe_ai_log",
        -- 首次创建从分区起始位置消费（缺省 OFFSET_END/LATEST 会在 job 创建瞬间
        -- 锁定末尾偏移，创建前已产生的日志消息被永久跳过；对日志入仓链路而言
        -- 历史消息应全部加载）。
        "property.kafka_default_offsets" = "OFFSET_BEGINNING",
        "property.group.id" = "doris_bfe_ai_log",
        "property.client.id" = "doris_bfe_ai_log"
    );
  04_create_aggregate_table.sql: |
    USE bfe_observability;
    
    CREATE TABLE bfe_ai_metrics_1m (
        ts_min             DATETIME        COMMENT '分钟时间桶',
        hostid             VARCHAR(256)    COMMENT '主机标识',
        ai_apikey_id       VARCHAR(128)    COMMENT 'API Key ID',
        ai_requested_model VARCHAR(128)    COMMENT '请求模型',
        ai_target_model    VARCHAR(128)    COMMENT '路由模型',
        ai_stream          TINYINT         COMMENT '流式标识',
        product            VARCHAR(64)     COMMENT '产品线',
        cluster            VARCHAR(64)     COMMENT '集群',
        sub_cluster        VARCHAR(64)     COMMENT '子集群',
        backend_info       VARCHAR(256)    COMMENT '后端节点',
        method             VARCHAR(16)     COMMENT 'HTTP 方法',
        res_status_code    SMALLINT        COMMENT '响应状态码',
        err_code           VARCHAR(64)     COMMENT '错误码',
        header_host        VARCHAR(256)    COMMENT '请求 Host',
        ai_provider        VARCHAR(64)     COMMENT '上游模型提供商',
        ai_protocol        VARCHAR(64)     COMMENT 'AI 协议',
        ai_mode            VARCHAR(64)     COMMENT 'AI 模式',
        ai_cost_currency   VARCHAR(16)     COMMENT '成本币种',
        level1Name         VARCHAR(128)    COMMENT 'Level1 标签名',
        level1             VARCHAR(128)    COMMENT 'Level1 标签值',
        level2Name         VARCHAR(128)    COMMENT 'Level2 标签名',
        level2             VARCHAR(128)    COMMENT 'Level2 标签值',
        level3Name         VARCHAR(128)    COMMENT 'Level3 标签名',
        level3             VARCHAR(128)    COMMENT 'Level3 标签值',
        level4Name         VARCHAR(128)    COMMENT 'Level4 标签名',
        level4             VARCHAR(128)    COMMENT 'Level4 标签值',
        level5Name         VARCHAR(128)    COMMENT 'Level5 标签名',
        level5             VARCHAR(128)    COMMENT 'Level5 标签值',
        rate_limit_policy_id VARCHAR(128)  COMMENT '限流策略ID',
        rate_limit_type   VARCHAR(32)     COMMENT '限流类型',
        rate_limit_rule_name VARCHAR(128)  COMMENT '限流规则名',
        ai_auth_reject_reason VARCHAR(256) COMMENT '认证拒绝原因',
        ai_auth_reject_quota_plans_slot1 VARCHAR(128) COMMENT '被拒绝配额计划槽位1',
        ai_auth_reject_quota_plans_slot2 VARCHAR(128) COMMENT '被拒绝配额计划槽位2',
        ai_auth_reject_quota_plans_slot3 VARCHAR(128) COMMENT '被拒绝配额计划槽位3',
        ai_auth_reject_quota_plans_slot4 VARCHAR(128) COMMENT '被拒绝配额计划槽位4',
        ai_auth_reject_quota_plans_slot5 VARCHAR(128) COMMENT '被拒绝配额计划槽位5',
        ai_cache_status    VARCHAR(16)     COMMENT '缓存状态（hit/miss/skip，空=未启用）',
        mirror_hit         TINYINT         COMMENT '镜像命中（0/1）',
        ai_intent_answer   VARCHAR(64)     COMMENT '意图答案（含 unknown，空=未分类）',
    
        -- 聚合指标（SUM）
        request_count      BIGINT   SUM    COMMENT '请求数',
        error_count        BIGINT   SUM    COMMENT '错误数',
        auth_reject_count  BIGINT   SUM    COMMENT '认证拒绝数',
        input_tokens       BIGINT   SUM    COMMENT '输入 Token 累计',
        output_tokens      BIGINT   SUM    COMMENT '输出 Token 累计',
        total_tokens       BIGINT   SUM    COMMENT '总 Token 累计',
        ttft_us_sum        BIGINT   SUM    COMMENT 'TTFT 累计（微秒）',
        tpot_us_sum        BIGINT   SUM    COMMENT 'TPOT 累计（微秒）',
        req_header_bytes   BIGINT   SUM    COMMENT '请求头字节累计',
        req_body_bytes     BIGINT   SUM    COMMENT '请求体字节累计',
        res_header_bytes   BIGINT   SUM    COMMENT '响应头字节累计',
        res_body_bytes     BIGINT   SUM    COMMENT '响应体字节累计',
        rate_limit_hits    BIGINT   SUM    COMMENT '限流命中次数',
        backend_retries    BIGINT   SUM    COMMENT '后端重试总次数',
        all_time_sum       BIGINT   SUM    COMMENT '总耗时累计（毫秒）',
        cluster_serve_sum  BIGINT   SUM    COMMENT '集群层耗时累计',
        backend_serve_sum  BIGINT   SUM    COMMENT '后端耗时累计',
        ai_retry_count_sum BIGINT   SUM    COMMENT '模型层重试总次数',
        ai_cost_value_sum  BIGINT   SUM    COMMENT '成本累计（固定点整数）',
        cache_read_tokens  BIGINT   SUM    COMMENT '缓存读取 Token 累计',
        cache_write_tokens BIGINT   SUM    COMMENT '缓存写入 Token 累计',
        ai_audio_input_tokens  BIGINT SUM   COMMENT '音频输入 Token 累计',
        ai_audio_output_tokens BIGINT SUM   COMMENT '音频输出 Token 累计',
        ai_image_count         BIGINT SUM   COMMENT '图片数量累计'
    )
    AGGREGATE KEY(ts_min, hostid, ai_apikey_id, ai_requested_model, ai_target_model, ai_stream,
                  product, cluster, sub_cluster, backend_info, method, res_status_code,
                  err_code, header_host, ai_provider, ai_protocol, ai_mode, ai_cost_currency,
