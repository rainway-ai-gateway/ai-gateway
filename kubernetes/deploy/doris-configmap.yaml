        level4Name       = json_unquote(json_extract(ai_apikeytags, '$.level4.tagname')),
        level4           = json_unquote(json_extract(ai_apikeytags, '$.level4.tagvalue')),
        level5Name       = json_unquote(json_extract(ai_apikeytags, '$.level5.tagname')),
