        res_header_bytes   BIGINT   SUM    COMMENT '响应头字节累计',
        res_body_bytes     BIGINT   SUM    COMMENT '响应体字节累计',
        rate_limit_hits    BIGINT   SUM    COMMENT '限流命中次数',
        backend_retries    BIGINT   SUM    COMMENT '后端重试总次数',
