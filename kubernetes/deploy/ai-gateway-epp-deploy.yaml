---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: epp
  namespace: ai-gateway-system
  labels:
    app: ai-gateway-epp
spec:
  serviceName: ai-gateway-epp
  replicas: 2
  selector:
    matchLabels:
      app: ai-gateway-epp
  template:
    metadata:
      labels:
        app: ai-gateway-epp
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: epp
        image: ghcr.io/rainway-ai-gateway/ai-gateway-epp:v0.0.1
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: AI_GATEWAY_API_ADDR
          value: http://ai-gateway-api.ai-gateway-system.svc.cluster.local:8183/inner-api/v1
        - name: AI_GATEWAY_API_TOKEN
          value: c5QFb-MrlKktJbOid2M3
        - name: AI_GATEWAY_EPP_INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: AI_GATEWAY_EPP_TLS_CERT
          value: /home/work/epp/certs/epp-cert.pem
        - name: AI_GATEWAY_EPP_TLS_KEY
          value: /home/work/epp/certs/epp-key.pem
        ports:
        - name: grpc
          containerPort: 9002
        - name: health
          containerPort: 9003
        - name: metrics
          containerPort: 9090
        volumeMounts:
        - name: epp-tls
          mountPath: /home/work/epp/certs/epp-cert.pem
          subPath: epp-cert.pem
        - name: epp-tls
          mountPath: /home/work/epp/certs/epp-key.pem
          subPath: epp-key.pem
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          tcpSocket:
            port: 9003
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 9003
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: epp-tls
        configMap:
          name: epp-tls

---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway-epp
  namespace: ai-gateway-system
  labels:
    app: ai-gateway-epp
spec:
  clusterIP: None
  selector:
    app: ai-gateway-epp
  ports:
  - name: grpc
    port: 9002
    targetPort: 9002
  - name: health
    port: 9003
    targetPort: 9003
  - name: metrics
    port: 9090
    targetPort: 9090
