# ai-gateway-controller: discovers labelled Kubernetes Services and pushes their
# endpoints to ai-gateway-api through InnerAPI /inner-api/v1/k8s_pools/{name}/instances.
# It replaces bfe-service-controller (retired in v0.8.0); that Deployment must be
# deleted before applying this file.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: bfe-ai-gateway-controller
  namespace: ai-gateway-system
  labels:
    app.kubernetes.io/name: bfe-ai-gateway-controller
    app.kubernetes.io/instance: bfe-ai-gateway-controller

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bfe-ai-gateway-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: bfe-ai-gateway-controller
  namespace: ai-gateway-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bfe-ai-gateway-controller
  namespace: ai-gateway-system
  labels:
    app.kubernetes.io/name: bfe-ai-gateway-controller
    app.kubernetes.io/instance: bfe-ai-gateway-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bfe-ai-gateway-controller
      app.kubernetes.io/instance: bfe-ai-gateway-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bfe-ai-gateway-controller
        app.kubernetes.io/instance: bfe-ai-gateway-controller
    spec:
      serviceAccountName: bfe-ai-gateway-controller
      containers:
        - name: bfe-ai-gateway-controller
          imagePullPolicy: IfNotPresent
          image: ghcr.io/rainway-ai-gateway/ai-gateway-controller:v1.1.0
          command: [ "/ai-gateway-controller" ]
          args:
            # Services must carry this label to be discovered; "*" matches any value.
            - '-ai-gateway-api-name=*'
            - '-ai-gateway-api-addr=http://ai-gateway-api.ai-gateway-system.svc.cluster.local:8183/'
            # System token of the control plane (same one conf-agent uses).
            # It needs k8s_pools Update/Delete on the InnerAPI; a 402 from the
            # control plane means the token lacks that permission.
            - '-ai-gateway-api-token=Token c5QFb-MrlKktJbOid2M3'
            # Cluster name used in the generated k8s pool names.
            - '-k8s-cluster-name=szyf'
            # "*" = watch all namespaces (only labelled Services are picked up).
            - '-namespace=*'
          ports:
            - name: health
              containerPort: 9081
            - name: metrics
              containerPort: 9080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: var-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: var-run
          emptyDir: {}
